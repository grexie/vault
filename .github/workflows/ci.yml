name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: make test check
      - if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          node scripts/browser-smoke.mjs
          docker run -d --rm --name vault-wallet-test -p 127.0.0.1:27028:27017 mongo:8.2 --bind_ip_all
          VAULT_WALLET_SMOKE=1 node scripts/vault-browser-smoke.mjs
