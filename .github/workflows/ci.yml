name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make test check
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-client openssh-sftp-server
          npm ci
          npx playwright install --with-deps chromium
          node scripts/browser-smoke.mjs
