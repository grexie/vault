<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#fafafa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Approve temporary SSH access from your phone."
    />
    <title>Remote SSH Agent</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header>
      <a href="/" class="brand"
        ><img class="brand-icon" src="/icon-192.png" alt="" /><span
          >Remote SSH<span class="brand-small">AGENT</span></span
        ></a
      >
    </header>
    <main id="app">
      <section class="loading">
        <div class="spinner"></div>
        <p>Connecting to your agent…</p>
      </section>
    </main>
    <div id="message" role="status" aria-live="polite"></div>

    <noscript
      >This app needs JavaScript to use passkeys and approve requests.</noscript
    >
  </body>
</html>
